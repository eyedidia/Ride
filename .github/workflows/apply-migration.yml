name: Apply DB Migration
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Run SQL
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql "host=aws-1-eu-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.gritbcrdxpeycnxrlulp sslmode=require" << 'SQL'
          CREATE OR REPLACE FUNCTION update_exam_date(
            p_caller_tid TEXT,
            p_tid        TEXT,
            p_exam_date  DATE
          )
          RETURNS JSONB LANGUAGE plpgsql SECURITY DEFINER AS $$
          BEGIN
            PERFORM _require_admin(p_caller_tid);
            UPDATE riders SET exam_date = p_exam_date WHERE tid = p_tid;
            IF NOT FOUND THEN RAISE EXCEPTION 'רוכב לא נמצא'; END IF;
            RETURN jsonb_build_object('success', true);
          END;
          $$;
          GRANT EXECUTE ON FUNCTION update_exam_date(TEXT,TEXT,DATE) TO anon;
          SQL
