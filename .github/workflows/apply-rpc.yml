name: Apply RPC Functions
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/supabase-backend
      - name: Install psql
        run: sudo apt-get install -y postgresql-client
      - name: Apply rpc.sql
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql "host=aws-1-eu-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.gritbcrdxpeycnxrlulp sslmode=require" \
            -f supabase/rpc.sql
