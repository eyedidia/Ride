<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>האזור האישי שלי — קבוצת אופניים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0b0e18;
  --surface:   #13172a;
  --surface2:  #1c2138;
  --border:    #252a45;
  --accent:    #4f7cff;
  --accent2:   #7c5cff;
  --green:     #2dd4a0;
  --red:       #ff5a5a;
  --orange:    #ffb347;
  --text:      #e8eaf6;
  --muted:     #6b728f;
  --radius:    14px;
  --radius-sm: 9px;
  --font:      'Heebo', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
}

body::before {
  content: '';
  position: fixed;
  top: 0; right: 0; left: 0; height: 260px;
  background: linear-gradient(180deg, rgba(79,124,255,0.1) 0%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

/* ─── SKIP LINK ─────────────────────────── */
.skip-link {
  position: absolute;
  top: -100%;
  right: 0;
  background: var(--accent);
  color: #fff;
  padding: 12px 20px;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  font-family: var(--font);
  font-weight: 700;
  font-size: 1rem;
  z-index: 9999;
  text-decoration: none;
  transition: top 0.15s;
}
.skip-link:focus { top: 0; outline: 3px solid #fff; outline-offset: 2px; }

/* ─── FOCUS ─────────────────────────────── */
:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
  border-radius: 5px;
}

/* ─── SR-ONLY ───────────────────────────── */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ─── HEADER ────────────────────────────── */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(11,14,24,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.header-user {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800;
  font-size: 0.85rem;
  flex-shrink: 0;
  color: #fff;
}

.header-name { font-size: 0.95rem; font-weight: 700; }
.header-role { font-size: 0.75rem; color: var(--muted); }

.btn-logout {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: var(--radius-sm);
  padding: 7px 12px;
  font-family: var(--font);
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
  min-height: 44px;
  min-width: 44px;
}
.btn-logout:hover { background: var(--surface2); color: var(--text); }

.btn-admin {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  color: #fff;
  border-radius: var(--radius-sm);
  padding: 7px 14px;
  font-family: var(--font);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  min-height: 44px;
  min-width: 44px;
  display: none;
  align-items: center;
  gap: 6px;
}
.btn-admin:hover { opacity: 0.88; transform: translateY(-1px); }
.btn-admin.visible { display: flex; }

/* ─── CONTENT ───────────────────────────── */
.content {
  position: relative;
  z-index: 1;
  max-width: 680px;
  margin: 0 auto;
  padding: 24px 16px;
}

/* ─── NOTIFICATION BANNERS ──────────────── */
.banner {
  border-radius: var(--radius);
  padding: 14px 18px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
  font-size: 0.92rem;
  font-weight: 500;
  line-height: 1.5;
  animation: bannerIn 0.3s ease;
}
@keyframes bannerIn {
  from { opacity:0; transform:translateY(-8px); }
  to   { opacity:1; transform:translateY(0); }
}
.banner-icon { font-size: 1.4rem; flex-shrink: 0; margin-top: 1px; }
.banner-body { flex: 1; }
.banner-title { font-weight: 800; font-size: 1rem; margin-bottom: 3px; }
.banner-sub   { font-size: 0.82rem; opacity: 0.85; }
.banner-birthday {
  background: linear-gradient(135deg, rgba(255,179,71,0.15), rgba(255,90,90,0.1));
  border: 1px solid rgba(255,179,71,0.4);
  color: var(--orange);
}
.banner-exam-warn {
  background: rgba(255,179,71,0.1);
  border: 1px solid rgba(255,179,71,0.35);
  color: var(--orange);
}
.banner-bday-club {
  background: linear-gradient(135deg, rgba(79,124,255,0.12), rgba(124,92,255,0.1));
  border: 1px solid rgba(79,124,255,0.3);
  color: var(--accent);
}

/* ─── 1-HOUR EVENT BANNER ───────────────── */
.event-soon-banner {
  background: linear-gradient(135deg, rgba(79,124,255,0.18), rgba(124,92,255,0.14));
  border: 1px solid rgba(79,124,255,0.45);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 16px;
}
.event-soon-banner .esb-title {
  font-weight: 700;
  font-size: 1rem;
  color: var(--accent);
  margin-bottom: 6px;
}
.event-soon-banner .esb-name {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}
.event-soon-banner p {
  font-size: 0.85rem;
  color: var(--muted);
  margin: 3px 0;
}

/* ─── EXAM BANNER ───────────────────────── */
.exam-banner {
  background: rgba(255,179,71,0.1);
  border: 1px solid rgba(255,179,71,0.35);
  border-radius: var(--radius);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  font-size: 0.88rem;
  color: var(--orange);
  font-weight: 500;
}

/* ─── REG BLOCKED BANNER ────────────────── */
.reg-blocked-banner {
  background: rgba(255,90,90,0.1);
  border: 1px solid rgba(255,90,90,0.4);
  border-radius: 12px;
  padding: 14px 18px;
  margin-bottom: 16px;
  display: none;
  align-items: flex-start;
  gap: 12px;
  font-size: 0.88rem;
  color: #ff8a8a;
  font-weight: 500;
}
.reg-blocked-banner.visible { display: flex; }

/* ─── BOTTOM NAV ────────────────────────── */
.bottom-nav {
  position: fixed;
  bottom: 0; right: 0; left: 0;
  z-index: 100;
  background: rgba(19,23,42,0.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex;
  padding: env(safe-area-inset-bottom, 0) 0 0;
}

.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 4px 12px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: var(--font);
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  transition: color 0.2s;
  min-height: 56px;
  position: relative;
}

.nav-btn:hover, .nav-btn.active { color: var(--accent); }

.nav-btn.active::before {
  content: '';
  position: absolute;
  top: 0; right: 25%; left: 25%;
  height: 2px;
  background: var(--accent);
  border-radius: 0 0 2px 2px;
}

.nav-icon { font-size: 1.5rem; }

/* ─── SECTIONS ──────────────────────────── */
.section { display: none; }
.section.active { display: block; }

/* ─── SECTION TITLE ─────────────────────── */
.section-title {
  font-size: 1.35rem;
  font-weight: 800;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ─── EVENT CARDS ───────────────────────── */
.events-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.event-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  transition: border-color 0.2s, transform 0.15s;
}

.event-card:hover { border-color: rgba(79,124,255,0.4); transform: translateY(-1px); }

.event-card.registered {
  border-color: rgba(45,212,160,0.4);
  background: rgba(45,212,160,0.04);
}

.event-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}

.event-title {
  font-size: 1.1rem;
  font-weight: 700;
  line-height: 1.3;
  margin: 0; /* איפוס margin ברירת מחדל של h2 */
}

.event-date {
  font-size: 0.88rem;
  color: var(--muted);
  margin-top: 3px;
}

.badge-reg {
  background: rgba(45,212,160,0.15);
  color: var(--green);
  font-size: 0.82rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
}

.event-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  list-style: none;
}

/* dl/dt/dd בתוך event-meta — מאופסים ויזואלית */
.event-meta dt,
.event-meta dd {
  display: inline;
  margin: 0;
  padding: 0;
}

.meta-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.88rem;
  color: var(--muted);
  background: var(--surface2);
  padding: 4px 10px;
  border-radius: 20px;
}

.meta-chip strong { color: var(--text); font-weight: 600; }

.event-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 11px 20px;
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  min-height: 48px;
  min-width: 44px;
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: #3a67f0; transform: translateY(-1px); }

.btn-ghost {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--surface2); color: var(--text); }

.btn-cancel {
  background: transparent;
  color: var(--red);
  border: 1px solid rgba(255,90,90,0.35);
}
.btn-cancel:hover { background: rgba(255,90,90,0.1); }

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

/* ─── HISTORY LIST ──────────────────────── */
.history-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.history-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.history-date-block {
  background: var(--surface2);
  border-radius: 10px;
  padding: 8px 12px;
  text-align: center;
  min-width: 54px;
  flex-shrink: 0;
}

.history-day  { font-size: 1.3rem; font-weight: 800; line-height: 1; color: var(--accent); }
.history-mon  { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

.history-info { flex: 1; min-width: 0; }
.history-title { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-meta  { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }

.history-km {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--accent);
  flex-shrink: 0;
}

/* ─── DATE GROUP VIEW ───────────────────── */
.date-group { margin-bottom: 8px; }

.date-group-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font);
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  text-align: right;
  transition: background 0.15s;
}
.date-group-btn:hover { background: var(--surface2); }
.date-group-btn[aria-expanded="true"] {
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
  border-bottom-color: transparent;
}
.date-group-count {
  margin-right: auto;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--muted);
}
.date-group-arrow { color: var(--muted); font-size: 0.75rem; }

.date-group-items {
  border: 1px solid var(--border);
  border-top: none;
  border-bottom-left-radius: var(--radius);
  border-bottom-right-radius: var(--radius);
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--bg);
}
.date-group-item {
  border-radius: 10px !important;
}

/* ─── PHONE BOOK ────────────────────────── */
.phonebook-search {
  position: relative;
  margin-bottom: 16px;
}

.search-icon {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}

.input {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font);
  font-size: 0.95rem;
  padding: 12px 42px 12px 14px;
  min-height: 48px;
  -webkit-appearance: none;
}

.input:focus { outline: none; border-color: var(--accent); }
.input::placeholder { color: var(--muted); }

.contact-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.contact-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.contact-info { min-width: 0; }
.contact-name { font-weight: 700; font-size: 0.95rem; }
.contact-city { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

.contact-phone {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.phone-num {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text);
  direction: ltr;
}

.call-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(45,212,160,0.15);
  border: none;
  color: var(--green);
  font-size: 1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
  flex-shrink: 0;
}
.call-btn:hover { background: rgba(45,212,160,0.28); }

/* ─── EMPTY STATE ───────────────────────── */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--muted);
}
.empty-icon { font-size: 3rem; margin-bottom: 12px; display: block; }
.empty-text { font-size: 0.95rem; }

/* ─── LOADING SKELETON ──────────────────── */
.skeleton {
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: var(--radius-sm);
  height: 80px;
  margin-bottom: 10px;
}
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ─── TOAST ─────────────────────────────── */
.toast-area {
  position: fixed;
  bottom: 80px;
  right: 16px; left: 16px;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
  align-items: center;
}

.toast {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 18px;
  font-size: 0.88rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  animation: toastIn 0.25s ease;
  pointer-events: auto;
  max-width: 360px;
}

@keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.toast.success { border-color: var(--green); }
.toast.error   { border-color: var(--red); }

@keyframes slideUpModal {
  from { transform: translateY(100%); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

/* ─── STATS MINI CARDS ──────────────────── */
.stat-mini {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
}
.stat-mini::before {
  content:''; position:absolute; top:0; right:0;
  width:4px; height:100%; border-radius:0 var(--radius) var(--radius) 0;
}
.stat-mini.blue::before  { background: var(--accent); }
.stat-mini.green::before { background: var(--green); }
.stat-mini-val { font-size:1.7rem; font-weight:800; line-height:1; margin-bottom:4px; }
.stat-mini.blue  .stat-mini-val { color: var(--accent); }
.stat-mini.green .stat-mini-val { color: var(--green); }
.stat-mini-lbl { font-size:0.76rem; color:var(--muted); font-weight:500; }

/* ─── STATS PANELS ──────────────────────── */
.stats-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
}
.stats-panel-title { font-size:0.85rem; font-weight:700; margin-bottom:10px; }
.partner-row, .bike-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 0; border-bottom:1px solid var(--border); gap:10px;
}
.partner-row:last-child, .bike-row:last-child { border-bottom:none; }
.partner-name { font-weight:600; font-size:0.9rem; }
.partner-meta { font-size:0.76rem; color:var(--muted); margin-top:2px; }
.partner-km   { font-size:0.85rem; font-weight:700; color:var(--accent); flex-shrink:0; }

/* ─── FILTERS ───────────────────────────── */
.history-filters { margin-bottom:14px; display:flex; flex-direction:column; gap:8px; }
.filter-row { display:flex; gap:8px; flex-wrap:wrap; }
.flt-select, .flt-input {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:var(--radius-sm); color:var(--text);
  font-family:var(--font); font-size:0.82rem;
  padding:8px 10px; min-height:44px; flex:1; min-width:120px;
}
.flt-select:focus, .flt-input:focus { outline:none; border-color:var(--accent); }
.flt-input::placeholder { color:var(--muted); }
.flt-reset {
  background:transparent; border:1px solid var(--border);
  border-radius:var(--radius-sm); color:var(--muted);
  font-family:var(--font); font-size:0.8rem;
  padding:8px 12px; cursor:pointer; min-height:44px;
  white-space:nowrap;
}
.flt-reset:hover { background:var(--surface2); color:var(--text); }

/* ─── PAGER ─────────────────────────────── */
.pager {
  display:flex; align-items:center; justify-content:center;
  gap:16px; padding:16px 0; margin-top:4px;
}
.pager-btn {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-sm); color:var(--text);
  width:44px; height:44px; cursor:pointer; font-size:1rem;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.2s;
}
.pager-btn:hover:not(:disabled) { background:var(--surface2); border-color:var(--accent); }
.pager-btn:disabled { opacity:0.35; cursor:not-allowed; }
.pager-info { font-size:0.85rem; color:var(--muted); font-weight:600; }

/* ─── RESPONSIVE ────────────────────────── */
@media (min-width: 640px) {
  .content { padding: 32px 24px; }
  .event-meta { gap: 14px; }
}
</style>
</head>
<body>

<!-- ─── SKIP LINK ──────────────────────── -->
<a href="#main-content" class="skip-link">דלג לתוכן הראשי</a>

<!-- ─── SR-ONLY LIVE ANNOUNCER ────────── -->
<!-- אזור זה מודיע לקוראי מסך על שינויים דינמיים -->
<div id="sr-announcer"
     class="sr-only"
     aria-live="assertive"
     aria-atomic="true"
     role="status"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxST_n3NGcPU99_PmDHLJO3W1Sb12rel6Sf_Y-ihzBFIGmmsYMOfrrxRZMLf-CMETcp/exec";

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let user        = null;
let allContacts = [];
let myRegs      = new Set();

// ══════════════════════════════════════════
// ACCESSIBILITY HELPERS
// ══════════════════════════════════════════

// הכרזה לקורא מסך — מיידית ו-assertive
function announce(message) {
  const el = document.getElementById('sr-announcer');
  // איפוס תחילה כדי שהכרזה חוזרת תופעל שוב
  el.textContent = '';
  requestAnimationFrame(() => {
    el.textContent = message;
  });
}

// ── FOCUS TRAP למודאל ──────────────────────
let _lastFocused = null; // שמירת האלמנט שפתח את המודאל

function trapFocus(e) {
  if (e.key !== 'Tab') return;
  const modal = document.getElementById('modalInner');
  const focusable = Array.from(
    modal.querySelectorAll(
      'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), ' +
      'textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
    )
  ).filter(el => !el.closest('[aria-hidden="true"]'));

  if (!focusable.length) { e.preventDefault(); return; }

  const first = focusable[0];
  const last  = focusable[focusable.length - 1];

  if (e.shiftKey) {
    if (document.activeElement === first) {
      e.preventDefault();
      last.focus();
    }
  } else {
    if (document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  const stored = sessionStorage.getItem('user');
  if (!stored) { window.location.replace('index.html'); return; }
  user = JSON.parse(stored);

  if (user.isAdmin) {
    document.getElementById('btnAdmin').classList.add('visible');
  }

  renderHeader();
  showPersonalNotifications();

  // בנרים לפי סטטוס בדיקה
  const examStatus = user.examStatus || '';
  if (!user.canRegister && !user.isAdmin) {
    const blocked    = document.getElementById('regBlockedBanner');
    const blockedTxt = document.getElementById('regBlockedText');
    if (examStatus.includes('אין בדיקה')) {
      blockedTxt.textContent = 'אין לך בדיקה ארגומטרית במערכת. לא ניתן להירשם לרכיבות. אנא פנה למנהל הקבוצה לתיאום בדיקה.';
    } else {
      blockedTxt.textContent = 'הבדיקה הארגומטרית שלך פגה תוקף. לא ניתן להירשם לרכיבות עד לחידוש הבדיקה. אנא פנה למנהל הקבוצה.';
    }
    blocked.classList.add('visible');
  } else if (examStatus.includes('⚠️')) {
    const banner = document.getElementById('examBanner');
    document.getElementById('examBannerText').textContent =
      'הבדיקה הארגומטרית שלך עומדת לפוג בקרוב. אנא פנה למנהל הקבוצה לחידוש.';
    banner.style.display = 'flex';
  }

  await loadEvents();
  checkUpcomingEventNotifications();
});

// ══════════════════════════════════════════
// 1-HOUR EVENT NOTIFICATION
// ══════════════════════════════════════════
async function checkUpcomingEventNotifications() {
  if (!cachedEvents.length) return;
  const now          = new Date();
  const oneHourLater = new Date(now.getTime() + 60 * 60 * 1000);

  const soonEvents = cachedEvents.filter(ev => {
    if (!myRegs.has(ev.id)) return false;
    const [d, m, y] = (ev.date || '').split('/');
    const [hh, mm]  = (ev.meetTime || '00:00').split(':');
    if (!d || !m || !y) return false;
    const eventTime = new Date(y, m - 1, d, hh || 0, mm || 0);
    return eventTime > now && eventTime <= oneHourLater;
  });

  if (!soonEvents.length) return;

  const ev = soonEvents[0];
  let assignmentHtml = '<p>רשום כ-סינגל</p>';

  try {
    const regs = await apiGet('getRegistrations', { eventId: ev.id });
    const myReg = regs.find(r => normTid(r.tid) === normTid(user.tid));
    if (myReg) {
      const minsLeft = Math.round((new Date(
        Number(ev.date.split('/')[2]),
        Number(ev.date.split('/')[1]) - 1,
        Number(ev.date.split('/')[0]),
        Number((ev.meetTime || '00:00').split(':')[0]),
        Number((ev.meetTime || '00:00').split(':')[1])
      ) - now) / 60000);

      const parts = [];
      if (myReg.role)    parts.push(`תפקיד: ${myReg.role}`);
      if (myReg.partner && myReg.partner !== '—') parts.push(`שותף: ${myReg.partner}`);
      if (myReg.bike    && myReg.bike    !== '—') parts.push(`אופניים: ${myReg.bike}`);
      if (ev.meetPoint)  parts.push(`נקודת מפגש: ${ev.meetPoint}`);
      assignmentHtml = parts.map(p => `<p>${esc(p)}</p>`).join('');

      const banner = document.createElement('div');
      banner.className = 'event-soon-banner';
      banner.setAttribute('role', 'alert');
      banner.setAttribute('aria-label', `אירוע בעוד ${minsLeft} דקות: ${ev.description}`);
      banner.innerHTML = `
        <div class="esb-title">
          <span aria-hidden="true">⏰</span> אירוע בעוד ${minsLeft} דקות!
        </div>
        <div class="esb-name">${esc(ev.description)}</div>
        ${assignmentHtml}
      `;
      const evSection = document.getElementById('section-events');
      evSection.prepend(banner);
      announce(`אירוע מתקרב: ${ev.description} בעוד ${minsLeft} דקות`);
    }
  } catch(_) {}
}

// ══════════════════════════════════════════
// PERSONAL NOTIFICATIONS
// ══════════════════════════════════════════
function showPersonalNotifications() {
  const area = document.getElementById('notificationsArea');
  if (!area || !user) return;

  const banners = [];
  const today   = new Date(); today.setHours(0,0,0,0);

  if (user.dob) {
    const dob = new Date(user.dob.split('/').reverse().join('-'));
    const bdayThisYear = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
    const diffDays = Math.round((bdayThisYear - today) / 86400000);

    if (diffDays >= 0 && diffDays <= 7) {
      if (diffDays === 0) {
        banners.push(`
          <div class="banner banner-birthday" role="status" aria-label="יום הולדת שמח היום">
            <span class="banner-icon" aria-hidden="true">🎂</span>
            <div class="banner-body">
              <div class="banner-title">יום הולדת שמח ${esc(user.name.split(' ')[0])}!</div>
              <div class="banner-sub">כל הקבוצה מאחלת לך יום הולדת שמח ורכיבות נהדרות!</div>
            </div>
          </div>`);
      } else {
        banners.push(`
          <div class="banner banner-birthday" role="status" aria-label="יום הולדת בעוד ${diffDays} ימים">
            <span class="banner-icon" aria-hidden="true">🎈</span>
            <div class="banner-body">
              <div class="banner-title">יום הולדת בעוד ${diffDays} ימים!</div>
              <div class="banner-sub">הקבוצה כבר מתרגשת לאחל לך</div>
            </div>
          </div>`);
      }
    } else if (diffDays < 0 && diffDays >= -2) {
      banners.push(`
        <div class="banner banner-birthday" role="status" aria-label="איחולי יום הולדת">
          <span class="banner-icon" aria-hidden="true">🎊</span>
          <div class="banner-body">
            <div class="banner-title">מאוחר קצת — אבל מזל טוב ${esc(user.name.split(' ')[0])}!</div>
            <div class="banner-sub">כל הקבוצה שולחת לך ברכות חמות!</div>
          </div>
        </div>`);
    }
  }

  if (user.examExpiry) {
    const expiry = new Date(user.examExpiry.split('/').reverse().join('-'));
    expiry.setHours(0,0,0,0);
    const daysLeft = Math.round((expiry - today) / 86400000);

    if (daysLeft > 0 && daysLeft <= 30) {
      banners.push(`
        <div class="banner banner-exam-warn" role="alert"
             aria-label="אזהרה: הבדיקה הארגומטרית פוגת תוקף בעוד ${daysLeft} ימים">
          <span class="banner-icon" aria-hidden="true">🩺</span>
          <div class="banner-body">
            <div class="banner-title">הבדיקה הארגומטרית פוגת תוקף בעוד ${daysLeft} ימים</div>
            <div class="banner-sub">תוקף עד: ${esc(user.examExpiry)} — אנא צור קשר עם מנהל הקבוצה לחידוש.</div>
          </div>
        </div>`);
    }
  }

  area.innerHTML = banners.join('');
}

// ══════════════════════════════════════════
// RENDER HEADER
// ══════════════════════════════════════════
function renderHeader() {
  document.getElementById('headerName').textContent = user.name;
  const roleLabel = { 'קפטן': 'רוכב קפטן', 'סטוקר': 'רוכב סטוקר', 'סינגל': 'רוכב סינגל' };
  const roleText = roleLabel[user.rideStyle] || user.rideStyle;
  document.getElementById('headerRole').textContent = roleText;
  const initials = user.name.trim().split(' ').map(w => w[0]).slice(0,2).join('');
  const av = document.getElementById('avatarEl');
  av.textContent = initials;
  // האווטאר הוא דקורטיבי — השם כבר מופיע ב-headerName
  av.setAttribute('aria-hidden', 'true');
  document.title = `${user.name} — קבוצת אופניים`;
}

const TABS = ['events','history','phonebook'];
const TAB_LABELS = {
  events:    'רכיבות קרובות',
  history:   'היסטוריית הרכיבות שלי',
  phonebook: 'ספר טלפונים'
};

async function switchTab(name) {
  TABS.forEach(t => {
    const sec = document.getElementById('section-' + t);
    const btn = document.getElementById('nav-' + t);
    if (t === name) {
      sec.classList.add('active'); sec.hidden = false;
      btn.classList.add('active');
      btn.setAttribute('aria-current','page');
    } else {
      sec.classList.remove('active'); sec.hidden = true;
      btn.classList.remove('active');
      btn.removeAttribute('aria-current');
    }
  });

  // הודעה לקורא מסך על מעבר לאגף
  announce(`עברת ל${TAB_LABELS[name]}`);

  // העברת focus לתוכן הראשי
  const main = document.getElementById('main-content');
  main.focus();

  // טעינה עצלה
  if (name === 'history' && document.getElementById('historyList').children[0]?.classList.contains('skeleton')) {
    await loadHistory();
  }
  if (name === 'phonebook' && document.getElementById('contactList').children[0]?.classList.contains('skeleton')) {
    await loadPhoneBook();
  }
}

// LOAD EVENTS
// ══════════════════════════════════════════
async function loadEvents() {
  const container = document.getElementById('eventsList');
  try {
    const [events, counts] = await Promise.all([
      apiGet('getEvents'),
      apiGet('getEventCounts').catch(() => ({}))
    ]);
    cachedEvents = events;
    cachedCounts = counts;
    await loadMyRegistrations(events);
    renderEvents(events, counts);
  } catch(e) {
    container.setAttribute('aria-busy','false');
    container.innerHTML = `<div class="empty-state" role="alert">
      <span class="empty-icon" aria-hidden="true">⚠️</span>
      <span class="empty-text">שגיאה בטעינת אירועים: ${esc(e.message)}</span>
    </div>`;
  }
}

async function loadMyRegistrations(events) {
  myRegs.clear();
  try {
    const checks = await Promise.all(
      events.map(ev => apiGet('getRegistrations', { eventId: ev.id })
        .then(regs => ({
          eventId: ev.id,
          registered: regs.some(r => normTid(r.tid) === normTid(user.tid))
        }))
        .catch(() => ({ eventId: ev.id, registered: false }))
      )
    );
    checks.forEach(c => { if (c.registered) myRegs.add(c.eventId); });
  } catch(_) {}
}

function normTid(val) {
  if (!val) return '';
  const str = String(val).trim().replace(/\.0+$/, '');
  return str.replace(/^0+(?=\d)/, '') || '0';
}

function normalizeEvent(ev) {
  return {
    id:          ev.id          || '',
    description: ev.description || '(ללא תיאור)',
    date:        ev.date        || '',
    meetTime:    ev.meetTime    || '',
    meetPoint:   ev.meetPoint   || '(לא הוגדרה)',
    km:          Number(ev.km   || 0),
    climb:       Number(ev.climb || 0),
    captain:     ev.captain     || '(לא הוגדר)'
  };
}

function renderEvents(events, counts = {}) {
  const container = document.getElementById('eventsList');
  container.setAttribute('aria-busy','false');

  if (!events.length) {
    container.innerHTML = `<div class="empty-state" role="status">
      <span class="empty-icon" aria-hidden="true">📅</span>
      <span class="empty-text">אין רכיבות קרובות כרגע</span>
    </div>`;
    return;
  }

  container.innerHTML = events.map(rawEv => {
    const ev     = normalizeEvent(rawEv);
    const isReg  = myRegs.has(ev.id);
    const canReg = user.canRegister;
    const count  = counts[ev.id] || 0;

    // ── הערה: אין aria-label על ה-article ––
    // VoiceOver/iOS מנווט בין אלמנטים פנימיים ולא קורא את label המכיל.
    // במקום זה: כל אמוג'י = aria-hidden, כל פרט = טקסט גלוי עם sr-only label.

    return `
    <article class="event-card ${isReg ? 'registered' : ''}" role="listitem">

      <div class="event-top">
        <div>
          <!-- שם הרכיבה — h2 כדי שVoiceOver יודיע "כותרת" -->
          <h2 class="event-title">${esc(ev.description)}</h2>

          <p class="event-date">
            <span aria-hidden="true">📅 </span><span class="sr-only">תאריך: </span>${esc(ev.date)}
            <span aria-hidden="true"> · 🕕 </span><span class="sr-only">, שעת מפגש: </span>${esc(ev.meetTime)}
          </p>
        </div>

        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
          ${isReg
            ? `<span class="badge-reg">
                 <span class="sr-only">סטטוס: </span>רשום
               </span>`
            : ''}
          ${count > 0
            ? `<span style="font-size:0.75rem;color:var(--muted)" aria-hidden="true">${count} נרשמו</span>
               <span class="sr-only">${count} אנשים נרשמו לרכיבה זו</span>`
            : ''}
        </div>
      </div>

      <!-- פרטי אירוע — dl/dt/dd לנגישות: קורא מסך יקרא "נקודת מפגש: X", "מרחק: Y ק"מ" וכו' -->
      <dl class="event-meta">
        <div class="meta-chip">
          <dt><span aria-hidden="true">📍 </span><span class="sr-only">נקודת מפגש:</span></dt>
          <dd>${esc(ev.meetPoint)}</dd>
        </div>
        <div class="meta-chip">
          <dt><span class="sr-only">מרחק:</span></dt>
          <dd><span aria-hidden="true">🚴 </span><strong>${esc(String(ev.km))}</strong> ק"מ</dd>
        </div>
        <div class="meta-chip">
          <dt><span class="sr-only">עלייה:</span></dt>
          <dd><span aria-hidden="true">⛰️ </span><strong>${esc(String(ev.climb))}</strong> מ' עלייה</dd>
        </div>
        <div class="meta-chip">
          <dt><span aria-hidden="true">👑 </span><span class="sr-only">קפטן:</span></dt>
          <dd>${esc(ev.captain)}</dd>
        </div>
      </dl>

      <div class="event-footer">
        <button class="btn btn-ghost"
                aria-label="הצג נרשמים לרכיבה ${esc(ev.description)}${count > 0 ? ' — ' + count + ' נרשמו' : ''}"
                aria-haspopup="dialog"
                onclick="showEventDetails('${esc(ev.id)}','${esc(ev.description)}',this)">
          <span aria-hidden="true">👥 </span>נרשמים${count > 0 ? ` (${count})` : ''}
        </button>

        ${isReg
          ? `<button class="btn btn-cancel"
                     aria-label="בטל הרשמה לרכיבה ${esc(ev.description)}"
                     onclick="cancelReg('${esc(ev.id)}','${esc(ev.description)}',this)">
               בטל הרשמה
             </button>`
          : `<button class="btn btn-primary"
                     ${!canReg ? 'disabled aria-disabled="true"' : ''}
                     aria-label="${canReg
                       ? `הירשם לרכיבה ${esc(ev.description)}`
                       : `לא ניתן להירשם לרכיבה ${esc(ev.description)} — נדרשת בדיקה ארגומטרית בתוקף`}"
                     onclick="register('${esc(ev.id)}','${esc(ev.description)}',this)">
               ${canReg ? '+ הירשם' : 'דרושה בדיקה ארגומטרית'}
             </button>`
        }
      </div>
    </article>`;
  }).join('');
}

// REGISTER / CANCEL
// ══════════════════════════════════════════
let cachedEvents = [];
let cachedCounts = {};
const _pendingRegistrations = new Set();
const _pendingCancellations = new Set();

async function register(eventId, eventName, btn) {
  if (_pendingRegistrations.has(eventId)) return;
  _pendingRegistrations.add(eventId);
  btn.disabled = true;
  btn.setAttribute('aria-busy', 'true');
  btn.setAttribute('aria-label', `מבצע הרשמה לרכיבה ${eventName}...`);
  btn.textContent = '...';

  try {
    await callAPI('register', { tid: user.tid, eventId, role: user.rideStyle });
    myRegs.add(eventId);
    cachedCounts[eventId] = (cachedCounts[eventId] || 0) + 1;
    announce(`נרשמת בהצלחה לרכיבה ${eventName}`);
    showToast(`נרשמת לרכיבה: ${eventName}`, 'success');
    renderEvents(cachedEvents, cachedCounts);
  } catch(e) {
    if (e.message && e.message.includes('כבר רשום')) {
      myRegs.add(eventId);
      renderEvents(cachedEvents, cachedCounts);
    } else {
      myRegs.delete(eventId);
      announce(`שגיאה בהרשמה לרכיבה ${eventName}: ${e.message}`);
      showToast('שגיאה בהרשמה: ' + (e.message || 'נסה שוב'), 'error');
      btn.disabled = false;
      btn.removeAttribute('aria-busy');
      btn.setAttribute('aria-label', `הירשם לרכיבה ${eventName}`);
      btn.textContent = '+ הירשם';
    }
  } finally {
    _pendingRegistrations.delete(eventId);
  }
}

async function cancelReg(eventId, eventName, btn) {
  if (_pendingCancellations.has(eventId)) return;
  _pendingCancellations.add(eventId);
  btn.disabled = true;
  btn.setAttribute('aria-busy', 'true');
  btn.setAttribute('aria-label', `מבטל הרשמה לרכיבה ${eventName}...`);
  btn.textContent = '...';
  try {
    // שלב 1: בדוק אם יש שיבוץ (שותף / אופניים) לרוכב זה
    const regs = await apiGet('getRegistrations', { eventId }).catch(() => []);
    const myReg = regs.find(r => normTid(r.tid) === normTid(user.tid));

    if (myReg) {
      // שלב 2א: אם קפטן עם סטוקר — פרק את הצמד קודם
      if (myReg.role === 'קפטן' && myReg.partnerTid) {
        await callAPI('unassignPartner', {
          eventId,
          captainTid:  user.tid,
          stokerTid:   myReg.partnerTid,
          partnerTid:  myReg.partnerTid,
          stokerName:  myReg.partner || ''
        }).catch(() => {});
      }
      // שלב 2ב: פנה שיבוץ אופניים (ריק = ביטול)
      if (myReg.bike && myReg.bike !== '—') {
        await callAPI('assignBike', {
          eventId, tid: user.tid, bikeId: ''
        }).catch(() => {});
      }
    }

    // שלב 3: בטל הרשמה
    await callAPI('cancelRegistration', { tid: user.tid, eventId });
    myRegs.delete(eventId);
    cachedCounts[eventId] = Math.max(0, (cachedCounts[eventId] || 1) - 1);
    announce(`ההרשמה לרכיבה ${eventName} בוטלה`);
    showToast(`ההרשמה לרכיבה "${eventName}" בוטלה`, 'success');
    renderEvents(cachedEvents, cachedCounts);
  } catch(e) {
    announce(`שגיאה בביטול הרשמה: ${e.message}`);
    showToast('שגיאה בביטול: ' + (e.message || 'נסה שוב'), 'error');
    btn.disabled = false;
    btn.removeAttribute('aria-busy');
    btn.setAttribute('aria-label', `בטל את ההרשמה שלי לרכיבה ${eventName}`);
    btn.textContent = '✕ בטל הרשמה';
  } finally {
    _pendingCancellations.delete(eventId);
  }
}

// RIDE HISTORY
// ══════════════════════════════════════════
const PAGE_SIZE     = 10;
let allHistory      = [];
let filteredHistory = [];
let currentPage     = 1;

async function loadHistory() {
  const container = document.getElementById('historyList');
  try {
    allHistory = await apiGet('getRideHistory', { tid: user.tid });
    container.setAttribute('aria-busy','false');

    if (!allHistory.length) {
      container.innerHTML = `<div class="empty-state" role="status">
        <span class="empty-icon" aria-hidden="true">🏅</span>
        <span class="empty-text">עדיין לא השתתפת ברכיבות</span>
      </div>`;
      return;
    }

    renderStats(allHistory);
    populateFilterOptions(allHistory);
    applyFilters();

  } catch(e) {
    container.innerHTML = `<div class="empty-state" role="alert">
      <span class="empty-icon" aria-hidden="true">⚠️</span>
      <span class="empty-text">שגיאה בטעינת היסטוריה: ${esc(e.message)}</span>
    </div>`;
  }
}

function renderStats(history) {
  document.getElementById('statsCards').style.display = 'block';
  document.getElementById('historyFilters').style.display = 'flex';

  const totalKm    = history.reduce((s, h) => s + (Number(h.km)    || 0), 0);
  const totalClimb = history.reduce((s, h) => s + (Number(h.climb) || 0), 0);

  document.getElementById('stat-total').textContent = history.length;
  document.getElementById('stat-km').textContent    = totalKm.toLocaleString('he-IL') + ' ק"מ';
  document.getElementById('stat-climb').textContent = totalClimb.toLocaleString('he-IL') + ' מ\'';

  const partners = {};
  history.forEach(h => {
    if (h.partner && h.partner !== '—' && h.partner !== '') {
      if (!partners[h.partner]) partners[h.partner] = { count: 0, km: 0 };
      partners[h.partner].count++;
      partners[h.partner].km += Number(h.km) || 0;
    }
  });
  const topPartners = Object.entries(partners)
    .sort((a,b) => b[1].count - a[1].count).slice(0,3);

  const partPanel = document.getElementById('topPartnersPanel');
  if (topPartners.length) {
    partPanel.style.display = 'block';
    // שימוש ב-dl/dt/dd לנגישות טובה יותר
    document.getElementById('topPartnersList').innerHTML = topPartners.map(([name, d]) => `
      <div class="partner-row">
        <div>
          <dt class="partner-name">${esc(name)}</dt>
          <dd class="partner-meta">${d.count} רכיבות יחד</dd>
        </div>
        <dd class="partner-km" aria-label="${d.km.toLocaleString('he-IL')} קילומטר">
          ${d.km.toLocaleString('he-IL')} ק"מ
        </dd>
      </div>`).join('');
  }

  const bikes = {};
  history.forEach(h => {
    if (h.bike && h.bike !== 'PRIVATE' && h.bike !== '') {
      bikes[h.bike] = (bikes[h.bike] || 0) + 1;
    }
  });
  const topBikes = Object.entries(bikes).sort((a,b) => b[1]-a[1]).slice(0,3);
  const bikePanel = document.getElementById('topBikePanel');
  if (topBikes.length) {
    bikePanel.style.display = 'block';
    document.getElementById('topBikesList').innerHTML = topBikes.map(([name, count]) => `
      <div class="bike-row">
        <dt class="partner-name">${esc(name)}</dt>
        <dd class="partner-km">${count} רכיבות</dd>
      </div>`).join('');
  }

  // first/last ride dates
  const sorted    = [...history].sort((a,b) => parseDate(a.date) - parseDate(b.date));
  const firstDate = sorted[0]?.date || '';
  const lastDate  = sorted[sorted.length - 1]?.date || '';
  const rideDatePanel = document.getElementById('rideDatePanel');
  const rideDateInfo  = document.getElementById('rideDateInfo');
  if (firstDate) {
    rideDatePanel.style.display = 'block';
    rideDateInfo.innerHTML = firstDate === lastDate
      ? `<div>רכיבה יחידה: <strong>${esc(firstDate)}</strong></div>`
      : `<div>רכיבה ראשונה: <strong>${esc(firstDate)}</strong></div>
         <div style="margin-top:4px">רכיבה אחרונה: <strong>${esc(lastDate)}</strong></div>`;
  }

  document.getElementById('historyViewToggle').style.display = 'block';
}

function populateFilterOptions(history) {
  const partners = [...new Set(history.map(h => h.partner).filter(p => p && p !== '—' && p !== ''))];
  const bikes    = [...new Set(history.map(h => h.bike).filter(b => b && b !== ''))];

  const pSel = document.getElementById('flt-partner');
  pSel.innerHTML = '<option value="">כל השותפים</option>' +
    partners.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');

  const bSel = document.getElementById('flt-bike');
  bSel.innerHTML = '<option value="">כל האופניים</option>' +
    bikes.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('');
}

function applyFilters() {
  const partner = document.getElementById('flt-partner')?.value || '';
  const bike    = document.getElementById('flt-bike')?.value    || '';
  const sort    = document.getElementById('flt-sort')?.value    || 'desc';
  const route   = document.getElementById('flt-route')?.value.trim().toLowerCase() || '';

  filteredHistory = allHistory.filter(h => {
    if (partner && h.partner !== partner) return false;
    if (bike    && h.bike    !== bike)    return false;
    if (route   && !h.description.toLowerCase().includes(route)) return false;
    return true;
  });

  filteredHistory.sort((a, b) => {
    if (sort === 'asc'    ) return parseDate(a.date) - parseDate(b.date);
    if (sort === 'km-desc') return (Number(b.km)||0) - (Number(a.km)||0);
    if (sort === 'km-asc' ) return (Number(a.km)||0) - (Number(b.km)||0);
    return parseDate(b.date) - parseDate(a.date);
  });

  currentPage = 1;
  renderHistoryPage();
}

function resetFilters() {
  document.getElementById('flt-partner').value = '';
  document.getElementById('flt-bike').value    = '';
  document.getElementById('flt-sort').value    = 'desc';
  document.getElementById('flt-route').value   = '';
  applyFilters();
  announce('הפילטרים נוקו');
}

function parseDate(str) {
  const [d,m,y] = (str||'').split('/');
  return new Date(`${y}-${m}-${d}`).getTime() || 0;
}

/* ─── Date View ─────────────────────────── */
let _dateViewActive = false;

function toggleDateView() {
  _dateViewActive = !_dateViewActive;
  const btn          = document.getElementById('btnDateView');
  const dateViewList = document.getElementById('dateViewList');
  const filters      = document.getElementById('historyFilters');
  const list         = document.getElementById('historyList');
  const pager        = document.getElementById('historyPager');

  btn.setAttribute('aria-pressed', _dateViewActive ? 'true' : 'false');
  btn.setAttribute('aria-label',   _dateViewActive ? 'חזור לרשימת הרכיבות' : 'הצג קבוצות תאריכים');
  btn.innerHTML = _dateViewActive
    ? '<span aria-hidden="true">📋</span> חזור לרשימה'
    : '<span aria-hidden="true">📅</span> תצוגת תאריכים';

  if (_dateViewActive) {
    filters.style.display      = 'none';
    list.style.display         = 'none';
    pager.style.display        = 'none';
    renderDateView();
    dateViewList.style.display = 'block';
    announce('מציג רכיבות לפי תאריך. לחץ על תאריך לראות פרטים');
  } else {
    dateViewList.style.display = 'none';
    filters.style.display      = 'flex';
    list.style.display         = 'block';
    applyFilters();
    announce('חזרת לרשימת הרכיבות');
  }
}

function renderDateView() {
  const byDate = {};
  allHistory.forEach(h => {
    const d = h.date || 'תאריך לא ידוע';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(h);
  });

  const dates = Object.keys(byDate).sort((a,b) => parseDate(b) - parseDate(a));
  const container = document.getElementById('dateViewList');

  container.innerHTML = dates.map((date, i) => {
    const rides = byDate[date];
    const count = rides.length;
    const id    = `date-grp-${i}`;
    return `
      <div role="listitem" class="date-group">
        <button class="date-group-btn"
                aria-expanded="false"
                aria-controls="${id}"
                onclick="toggleDateGroup(this,'${id}')">
          <span>${esc(date)}</span>
          <span class="date-group-count">${count} ${count === 1 ? 'רכיבה' : 'רכיבות'}</span>
          <span class="date-group-arrow" aria-hidden="true">▼</span>
        </button>
        <div id="${id}" class="date-group-items" style="display:none" role="list">
          ${rides.map(h => `
            <div class="history-item date-group-item" role="listitem">
              <div class="history-info">
                <div class="history-title">${esc(h.description)}</div>
                <div class="history-meta">
                  <span class="sr-only">תפקיד: </span><span>${esc(h.role || '—')}</span>
                  ${h.bike ? `<span aria-hidden="true"> · </span><span class="sr-only">אופניים: </span><span>${esc(h.bike)}</span>` : ''}
                  ${h.partner && h.partner !== '—'
                    ? `<span aria-hidden="true"> · </span><span class="sr-only">שותף: </span><span>עם ${esc(h.partner)}</span>`
                    : ''}
                </div>
                <div class="history-meta" style="margin-top:4px">
                  <span aria-label="${esc(String(h.km))} קילומטר">${esc(String(h.km))} ק"מ</span>
                  ${Number(h.climb) > 0
                    ? `<span aria-hidden="true"> · </span><span aria-label="${Number(h.climb).toLocaleString('he-IL')} מטר עלייה">${Number(h.climb).toLocaleString('he-IL')} מ' עלייה</span>`
                    : ''}
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;
  }).join('');
}

function toggleDateGroup(btn, contentId) {
  const content  = document.getElementById(contentId);
  const expanded = btn.getAttribute('aria-expanded') === 'true';
  btn.setAttribute('aria-expanded', expanded ? 'false' : 'true');
  content.style.display = expanded ? 'none' : 'block';
  btn.querySelector('.date-group-arrow').textContent = expanded ? '▼' : '▲';
}

function renderHistoryPage() {
  const container  = document.getElementById('historyList');
  const pager      = document.getElementById('historyPager');
  const totalPages = Math.ceil(filteredHistory.length / PAGE_SIZE);

  if (!filteredHistory.length) {
    container.innerHTML = `<div class="empty-state" role="status">
      <span class="empty-icon" aria-hidden="true">🔍</span>
      <span class="empty-text">לא נמצאו רכיבות תואמות לפילטר</span>
    </div>`;
    pager.style.display = 'none';
    announce('לא נמצאו רכיבות תואמות לפילטר');
    return;
  }

  const start    = (currentPage - 1) * PAGE_SIZE;
  const pageData = filteredHistory.slice(start, start + PAGE_SIZE);

  container.innerHTML = pageData.map(h => {
    const parts = (h.date||'').split('/');
    const day = parts[0]||'??';
    const mon = parts[1] ? monthName(parseInt(parts[1])) : '';

    // בלוק תאריך ויזואלי בלבד — sr-only נותן תאריך מלא
    return `
    <div class="history-item" role="listitem">
      <!-- ויזואלי בלבד — sr-only ליד נותן את התאריך המלא -->
      <div class="history-date-block" aria-hidden="true">
        <div class="history-day">${esc(day)}</div>
        <div class="history-mon">${esc(mon)}</div>
      </div>
      <span class="sr-only">תאריך: ${esc(h.date)},</span>

      <div class="history-info">
        <div class="history-title">${esc(h.description)}</div>
        <div class="history-meta">
          <span class="sr-only">תפקיד: </span><span>${esc(h.role)}</span>
          ${h.bike
            ? `<span aria-hidden="true"> · </span><span class="sr-only">, אופניים: </span><span>${esc(h.bike)}</span>`
            : ''}
          ${h.partner && h.partner !== '—'
            ? `<span aria-hidden="true"> · </span><span class="sr-only">, שותף: </span><span>עם ${esc(h.partner)}</span>`
            : ''}
        </div>
      </div>

      <div class="history-km">
        <span aria-hidden="true">${esc(String(h.km))} ק"מ</span>
        <span class="sr-only">${esc(String(h.km))} קילומטר</span>
      </div>
    </div>`;
  }).join('');

  if (totalPages > 1) {
    pager.style.display = 'flex';
    const infoText = `עמוד ${currentPage} מתוך ${totalPages} (${filteredHistory.length} רכיבות)`;
    document.getElementById('pagerInfo').textContent = infoText;
    document.getElementById('pagerPrev').disabled = currentPage <= 1;
    document.getElementById('pagerNext').disabled = currentPage >= totalPages;
    announce(infoText);
  } else {
    pager.style.display = 'none';
  }
}

function changePage(dir) {
  const totalPages = Math.ceil(filteredHistory.length / PAGE_SIZE);
  currentPage = Math.max(1, Math.min(totalPages, currentPage + dir));
  renderHistoryPage();
  document.getElementById('section-history').scrollIntoView({ behavior:'smooth', block:'start' });
}

function monthName(m) {
  return ['','ינו','פבר','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצמ'][m] || '';
}

// ══════════════════════════════════════════
// EVENT DETAILS MODAL
// ══════════════════════════════════════════
async function showEventDetails(eventId, eventName, triggerBtn) {
  // שמירת הכפתור שפתח את המודאל לצורך החזרת focus בסגירה
  _lastFocused = triggerBtn || document.activeElement;

  const modal = document.getElementById('modalEventDetails');
  const body  = document.getElementById('modalEventBody');
  document.getElementById('modal-event-title').textContent = eventName;
  body.innerHTML = `<div style="text-align:center;padding:20px;color:var(--muted)" role="status" aria-live="polite">טוען נרשמים...</div>`;
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';

  // הפעלת focus trap
  modal.addEventListener('keydown', trapFocus);

  // העברת focus לתוכן הראשי של המודאל (לא כפתור הסגירה)
  // כך קורא מסך יתחיל מהתוכן ולא מכפתור "סגור"
  requestAnimationFrame(() => {
    const modal = document.getElementById('eventDetailsModal');
    const firstContent = modal.querySelector('h2, h3, [role="status"], p');
    (firstContent || document.getElementById('modalCloseBtn')).focus();
  });

  try {
    const regs = await apiGet('getRegistrations', { eventId });
    if (!regs.length) {
      body.innerHTML = `<p style="text-align:center;color:var(--muted);padding:20px" role="status">אין נרשמים עדיין</p>`;
      return;
    }

    const captains        = regs.filter(r => r.role === 'קפטן');
    const singles         = regs.filter(r => r.role === 'סינגל');
    const unpairedStokers = regs.filter(r => r.role === 'סטוקר');

    let html = `<p style="margin-bottom:14px;font-size:0.85rem;color:var(--muted)" role="status">
      סה"כ ${regs.length} נרשמים לרכיבה ${esc(eventName)}
    </p>`;

    if (captains.length) {
      html += `<h3 style="font-size:0.78rem;font-weight:700;color:var(--muted);
                           text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">
                 צוותי טנדם (${captains.length})
               </h3>`;

      html += captains.map(c => {
        const partnerName = c.partner && c.partner !== '—' && c.partner !== '' ? c.partner : null;
        const isMe = normTid(c.tid) === normTid(user.tid);
        const teamLabel = partnerName
          ? `צוות טנדם: קפטן ${c.name}${isMe ? ' (אתה)' : ''}, סטוקר ${partnerName}`
          : `קפטן ${c.name}${isMe ? ' (אתה)' : ''}, ממתין לסטוקר`;

        return `
        <div style="background:var(--surface2);border-radius:12px;margin-bottom:10px;
                    overflow:hidden;border:1px solid ${isMe ? 'var(--accent)' : 'var(--border)'}"
             role="group"
             aria-label="${esc(teamLabel)}">
          <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;
                      border-bottom:${partnerName ? '1px solid var(--border)' : 'none'}">
            <div style="width:32px;height:32px;border-radius:50%;flex-shrink:0;
                        background:linear-gradient(135deg,var(--accent),var(--accent2));
                        display:flex;align-items:center;justify-content:center;
                        font-weight:800;font-size:0.78rem;color:#fff" aria-hidden="true">
              ${esc(c.name.trim().split(' ').map(w=>w[0]).slice(0,2).join(''))}
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:0.9rem">
                ${esc(c.name)}
                ${isMe ? '<span style="font-size:0.7rem;background:rgba(79,124,255,0.2);color:var(--accent);padding:2px 7px;border-radius:20px;margin-right:4px;font-weight:700" aria-label="זה אתה">אתה</span>' : ''}
              </div>
              <div style="font-size:0.72rem;color:var(--muted)" aria-hidden="true">קפטן${c.bike && c.bike !== '—' ? ` · ${esc(c.bike)}` : ''}</div>
            </div>
          </div>
          ${partnerName ? `
          <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(45,212,160,0.04)">
            <div style="width:32px;height:32px;border-radius:50%;flex-shrink:0;
                        background:rgba(45,212,160,0.2);
                        display:flex;align-items:center;justify-content:center;
                        font-weight:800;font-size:0.78rem;color:var(--green)" aria-hidden="true">
              ${esc(partnerName.trim().split(' ').map(w=>w[0]).slice(0,2).join(''))}
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:0.9rem">${esc(partnerName)}</div>
              <div style="font-size:0.72rem;color:var(--muted)" aria-hidden="true">סטוקר</div>
            </div>
          </div>` : `
          <div style="padding:10px 14px;font-size:0.8rem;color:var(--muted);font-style:italic" aria-label="ממתין לשיבוץ סטוקר">
            ממתין לסטוקר
          </div>`}
        </div>`;
      }).join('');
    }

    if (unpairedStokers.length) {
      html += `<h3 style="font-size:0.78rem;font-weight:700;color:var(--muted);
                           text-transform:uppercase;letter-spacing:0.08em;
                           margin-top:${captains.length ? '14px' : '0'};margin-bottom:8px">
                 סטוקרים ממתינים לשיבוץ (${unpairedStokers.length})
               </h3>`;

      html += unpairedStokers.map(s => {
        const isMe = normTid(s.tid) === normTid(user.tid);
        return `
        <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;
                    background:var(--surface2);border-radius:10px;margin-bottom:8px;
                    border:1px solid ${isMe ? 'var(--accent)' : 'var(--border)'}"
             aria-label="סטוקר: ${esc(s.name)}${isMe ? ', זה אתה' : ''}, ממתין לשיבוץ">
          <div style="width:32px;height:32px;border-radius:50%;flex-shrink:0;
                      background:rgba(255,179,71,0.2);
                      display:flex;align-items:center;justify-content:center;
                      font-weight:800;font-size:0.78rem;color:var(--orange)" aria-hidden="true">
            ${esc(s.name.trim().split(' ').map(w=>w[0]).slice(0,2).join(''))}
          </div>
          <div style="flex:1">
            <div style="font-weight:700;font-size:0.9rem">
              ${esc(s.name)}
              ${isMe ? '<span style="font-size:0.7rem;background:rgba(79,124,255,0.2);color:var(--accent);padding:2px 7px;border-radius:20px;margin-right:4px;font-weight:700" aria-label="זה אתה">אתה</span>' : ''}
            </div>
            <div style="font-size:0.72rem;color:var(--muted)" aria-hidden="true">סטוקר · ממתין לשיבוץ</div>
          </div>
        </div>`;
      }).join('');
    }

    if (singles.length) {
      html += `<h3 style="font-size:0.78rem;font-weight:700;color:var(--muted);
                           text-transform:uppercase;letter-spacing:0.08em;
                           margin-top:${captains.length || unpairedStokers.length ? '14px' : '0'};margin-bottom:8px">
                 רוכבי סינגל (${singles.length})
               </h3>`;

      html += singles.map(s => {
        const isMe = normTid(s.tid) === normTid(user.tid);
        return `
        <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;
                    background:var(--surface2);border-radius:10px;margin-bottom:8px;
                    border:1px solid ${isMe ? 'var(--accent)' : 'var(--border)'}"
             aria-label="סינגל: ${esc(s.name)}${isMe ? ', זה אתה' : ''}${s.bike && s.bike !== '—' ? ', אופניים ' + s.bike : ''}">
          <div style="width:32px;height:32px;border-radius:50%;flex-shrink:0;
                      background:var(--surface);border:1px solid var(--border);
                      display:flex;align-items:center;justify-content:center;
                      font-weight:800;font-size:0.78rem;color:var(--text)" aria-hidden="true">
            ${esc(s.name.trim().split(' ').map(w=>w[0]).slice(0,2).join(''))}
          </div>
          <div style="flex:1">
            <div style="font-weight:700;font-size:0.9rem">
              ${esc(s.name)}
              ${isMe ? '<span style="font-size:0.7rem;background:rgba(79,124,255,0.2);color:var(--accent);padding:2px 7px;border-radius:20px;margin-right:4px;font-weight:700" aria-label="זה אתה">אתה</span>' : ''}
            </div>
            <div style="font-size:0.72rem;color:var(--muted)" aria-hidden="true">סינגל${s.bike && s.bike !== '—' ? ` · ${esc(s.bike)}` : ''}</div>
          </div>
        </div>`;
      }).join('');
    }

    body.innerHTML = html;

  } catch(e) {
    body.innerHTML = `<p style="color:var(--red);padding:20px" role="alert">שגיאה בטעינת נרשמים: ${esc(e.message)}</p>`;
  }
}

function closeEventModal() {
  const modal = document.getElementById('modalEventDetails');
  modal.style.display = 'none';
  modal.removeEventListener('keydown', trapFocus);
  document.body.style.overflow = '';
  announce('חלון הנרשמים נסגר');
  // החזרת focus לכפתור שפתח את המודאל
  if (_lastFocused) {
    _lastFocused.focus();
    _lastFocused = null;
  }
}

// סגירה עם Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const modal = document.getElementById('modalEventDetails');
    if (modal.style.display !== 'none') closeEventModal();
  }
});

// ══════════════════════════════════════════
// PHONE BOOK
// ══════════════════════════════════════════
async function loadPhoneBook() {
  const container = document.getElementById('contactList');
  try {
    allContacts = await apiGet('getPhoneBook');
    container.setAttribute('aria-busy','false');
    renderContacts(allContacts);
  } catch(e) {
    container.innerHTML = `<div class="empty-state" role="alert">
      <span class="empty-icon" aria-hidden="true">⚠️</span>
      <span class="empty-text">שגיאה בטעינת אנשי קשר: ${esc(e.message)}</span>
    </div>`;
  }
}

function renderContacts(contacts) {
  const container = document.getElementById('contactList');
  if (!contacts.length) {
    container.innerHTML = `<div class="empty-state" role="status">
      <span class="empty-icon" aria-hidden="true">📞</span>
      <span class="empty-text">לא נמצאו אנשי קשר</span>
    </div>`;
    return;
  }
  container.innerHTML = contacts.map(c => `
    <div class="contact-card" role="listitem">
      <div class="contact-info">
        <div class="contact-name">${esc(c.name)}</div>
        <div class="contact-city">${esc(c.city)}</div>
      </div>
      <div class="contact-phone">
        <!-- המספר מוסתר מקורא מסך כי כפתור ההתקשרות כבר אומר הכל -->
        <span class="phone-num" aria-hidden="true">${esc(c.phone)}</span>
        <a href="tel:${esc(c.phone)}"
           class="call-btn"
           aria-label="התקשר אל ${esc(c.name)}, מספר ${esc(c.phone)}">
          <span aria-hidden="true">📞</span>
        </a>
      </div>
    </div>`).join('');

  // הכרזה על כמות התוצאות
  announce(`נמצאו ${contacts.length} אנשי קשר`);
}

function filterContacts(query) {
  const q = query.trim().toLowerCase();
  const filtered = q
    ? allContacts.filter(c =>
        c.name.toLowerCase().includes(q) ||
        c.city.toLowerCase().includes(q)
      )
    : allContacts;
  renderContacts(filtered);
}

// ══════════════════════════════════════════
// API HELPERS
// ══════════════════════════════════════════
async function apiGet(action, params = {}) {
  const controller = new AbortController();
  const timeoutId  = setTimeout(() => controller.abort(), 8000);
  try {
    const qs  = new URLSearchParams({ action, ...params }).toString();
    const res = await fetch(`${API_URL}?${qs}`, { signal: controller.signal });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'שגיאת שרת לא ידועה');
    return data.data;
  } catch(err) {
    if (err.name === 'AbortError') throw new Error('הקישור לשרת עלה על הזמן המוקצב. נסה שוב.');
    throw err;
  } finally {
    clearTimeout(timeoutId);
  }
}

async function callAPI(action, body = {}) {
  const controller = new AbortController();
  const timeoutId  = setTimeout(() => controller.abort(), 8000);
  try {
    const qs  = new URLSearchParams({ action, data: JSON.stringify(body) }).toString();
    const res = await fetch(`${API_URL}?${qs}`, { signal: controller.signal });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'שגיאת שרת לא ידועה');
    return data.data;
  } catch(err) {
    if (err.name === 'AbortError') throw new Error('הקישור לשרת עלה על הזמן המוקצב. נסה שוב.');
    throw err;
  } finally {
    clearTimeout(timeoutId);
  }
}

// ══════════════════════════════════════════
// TOAST & UTILS
// ══════════════════════════════════════════
function showToast(message, type = 'success') {
  const area  = document.getElementById('toastArea');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  // Toast כבר ב-aria-live region, אין צורך ב-role נוסף
  toast.innerHTML = `<span aria-hidden="true">${type === 'success' ? '✅' : '❌'}</span> ${message}`;
  area.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

function esc(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
